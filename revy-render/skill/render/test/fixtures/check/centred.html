<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root { color-scheme: light dark; }
body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: Canvas; color: CanvasText; }
main { max-width: 1200px; margin: 0 auto; padding: 16px; }
h2 { margin: 0 0 1rem; }
.frame { overflow-x: auto; display: flex; justify-content: center; }
.frame > svg { flex: none; }
</style>
</head>
<body>
<main>
<section id="centred">
<h2>Centred</h2>
<figure><figcaption>Wide flow</figcaption><div class="frame"><svg aria-label="Wide flow" width="900" height="40" viewBox="0 0 900 40"><text x="10" y="25" font-size="16">start</text><text x="800" y="25" font-size="16">end</text></svg></div></figure>
</section>
</main>
</body>
</html>
